<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIX Logs | Nexus FIX</title><link rel="stylesheet" href="{{ url_for('static',filename='connection.css') }}?v={{ asset_version }}"><link rel="stylesheet" href="{{ url_for('static',filename='logs.css') }}?v={{ asset_version }}"><link rel="stylesheet" href="{{ url_for('static',filename='fix_pages.css') }}?v={{ asset_version }}"><link rel="stylesheet" href="{{ url_for('static',filename='app_nav.css') }}?v={{ asset_version }}"></head><body>
{% include '_topnav.html' %}
<main><div class="heading"><div><p class="eyebrow">TT FIX DIAGNOSTICS</p><h1>FIX logs</h1><p class="subtitle">Actual session, market-data, order and execution messages. Credential fields are redacted.</p></div></div>
<section class="controls"><select id="category"><option>All</option><option>FIX Session</option><option>Market Data</option><option>Orders</option><option>Executions</option><option>Errors</option></select><input id="search" placeholder="Search symbol, ID, type or message"><button id="refresh">Refresh</button><a id="download" href="/api/fix-logs.csv">Download CSV</a><button id="clear" class="danger">Clear logs</button><label><input id="auto" type="checkbox" checked> Auto-refresh</label></section>
<p id="summary"></p><section class="logtable"><table><thead><tr><th>Timestamp</th><th>Level</th><th>Category</th><th>Session</th><th>Dir</th><th>Event</th><th>Seq</th><th>Details</th></tr></thead><tbody id="rows"></tbody></table></section>
<dialog id="detail"><button id="close">Close</button><h2>FIX entry</h2><pre id="entry"></pre></dialog></main><script src="{{ url_for('static',filename='logs.js') }}?v={{ asset_version }}"></script></body></html>
