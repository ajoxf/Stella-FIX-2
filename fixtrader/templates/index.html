<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nexus FIX</title>
<!-- Everything is self-hosted. A blocked CDN has taken a trading UI down
     before, and the dialog that reports "could not save" has to work when the
     network is what failed. -->
<link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='terminal.css') }}?v={{ asset_version }}">
<script>try{var fs=localStorage.getItem('ft.fs');if(fs)document.documentElement.style.setProperty('--fs',fs);}catch(e){}</script>
<link rel="stylesheet" href="{{ url_for('static', filename='app_nav.css') }}?v={{ asset_version }}">
<link rel="stylesheet" href="{{ url_for('static', filename='monitor.css') }}?v={{ asset_version }}">
</head>
<body>

{% include "_topnav.html" %}

<!-- A dead engine must never be mistaken for a quiet market. -->
<div id="engine-banner" class="banner hidden" role="status"></div>
<!-- Positions at the venue this book cannot explain. Never closed
     automatically; put here for a person to decide. -->
<div id="unclaimed-banner" class="banner critical hidden" role="alert"></div>
<div id="restart-banner" class="banner warn hidden" role="status"></div>

<div id="desktop"></div>
<div id="toasts" aria-live="polite"></div>

<div id="taskbar">
  <button id="add-panel" class="tk" title="Open a window">+</button>
  <div id="add-menu" class="menu hidden"></div>
  <div id="tabs"></div>
  <div class="taskbar-right">
    <span id="link-badge" class="link unknown" title="The venue session, and whether prices are arriving">checking&hellip;</span>
    <a class="tk" href="/desk" title="Open the algorithm desk">Algo desk</a>
    <button id="master-toggle" class="tk" title="The one switch that stands every contract's algo down at once">Master: &mdash;</button>
    <button id="execution-toggle" class="tk hidden" title="Where the Algo's orders go: PAPER fills them here; UAT (or LIVE on a live venue) sends them to Stellar">Orders: &mdash;</button>
    <button id="sound-toggle" class="tk" title="A blip when an order is sent, two rising notes on a fill, a low note on a reject">Sound: on</button>
    <button id="tidy" class="tk" title="Put every window back in a row">Tidy</button>
    <button id="text-smaller" class="tk" title="Smaller text">A&minus;</button><span id="text-size" class="stat" title="Text size — kept in this browser">Text 130%</span><button id="text-bigger" class="tk" title="Bigger text">A+</button>
    <a class="tk" href="/settings" title="How the system runs">Settings</a>
    <a class="tk" href="/exchanges" title="Venues, FIX sessions and contracts">Exchanges</a>
    <span id="loop-stat" class="stat" title="The engine's achieved loop, and how old this snapshot is">&mdash;</span>
    <button id="kill" class="kill" title="Stand every algo down and cancel our working orders">KILL ALL</button>
  </div>
</div>

<!-- One shared modal. No native confirm() / alert() / prompt(), ever — a test
     fails the build if they come back. -->
<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-box">
    <h2 id="modal-title"></h2>
    <p id="modal-warn" class="modal-warn" hidden></p>
    <p id="modal-body"></p>
    <div class="modal-actions">
      <button id="modal-cancel" class="btn">Cancel</button>
      <button id="modal-confirm" class="btn danger"></button>
    </div>
  </div>
</div>

<!-- Every open position, in one place. The per-contract window shows its own;
     this is the one screen that answers "what am I in, across everything" —
     with what the VENUE says beside what this book holds, because the two
     disagreeing is the thing worth seeing. -->
<template id="positions-template">
  <section class="win winwide tmonwin" data-key="__positions__">
    <div class="titlebar">
      <span class="swatch" style="background:#1c1c1c"></span>
      <span class="title">Trading Monitor</span>
      <span class="venue tm-count"></span>
      <span class="winbtns"><button class="winbtn min" title="Minimise — the taskbar button brings it back">&#8211;</button><button class="winbtn close" title="Close this window">&times;</button></span>
    </div>
    <div class="wbody tmon" style="padding:0">
      <div class="mon-tabs" role="tablist">
        <button type="button" data-tab="positions" class="on">Positions <sup class="n-positions"></sup></button>
        <button type="button" data-tab="orders">Working Orders <sup class="n-orders"></sup></button>
        <button type="button" data-tab="fills">Fills</button>
        <button type="button" data-tab="slippage">Slippage</button>
        <button type="button" data-tab="accounts">Accounts</button>
        <button type="button" data-tab="reconcile">Reconciler</button>
        <button type="button" data-tab="analysis">Analysis</button>
      </div>
      <div class="mon-pane"></div>
      <div class="mon-note"></div>
    </div>
  </section>
</template>

<template id="config-template">
  <section class="win cfgwin">
    <div class="titlebar">
      <span class="swatch" style="background:#7a6cae"></span>
      <span class="title"></span>
      <span class="venue cfg-key"></span>
      <span class="winbtns"><button class="winbtn close" title="Close without saving">&times;</button></span>
    </div>

    <div class="badgebar">
      <span class="state cfg-state">SETTINGS</span>
      <span class="hint">A blank box uses the desk default, shown in grey. <b>0</b> is a number, not a blank.</span>
    </div>

    <div class="subtabs"><div class="cfg-tabs"></div></div>
    <div class="cfg-body"></div>

    <div class="wfoot">
      <button class="btn pri cfg-save">Save</button>
      <button class="btn cfg-revert" title="Throw away what is typed and read the saved settings again">Revert</button>
      <span class="grow cfg-note"></span>
    </div>
  </section>
</template>

<template id="analysis-template">
  <section class="win winwide" data-key="__analysis__">
    <div class="titlebar">
      <span class="swatch" style="background:#3f8b52"></span>
      <span class="title">Analysis</span>
      <span class="venue an-note">closed trades only</span>
      <span class="winbtns"><button class="winbtn close" title="Close this window">&times;</button></span>
    </div>

    <div class="subtabs">
      <div class="an-tabs"></div>
      <span class="right">
        <select class="an-period" title="Cut by when each trade CLOSED">
          <option value="all">Since inception</option>
          <option value="30d">Last 30 days</option>
          <option value="7d">Last 7 days</option>
          <option value="today">Today</option>
        </select>
        <select class="an-mode" title="Simulated fills are never blended into a live figure without being asked for">
          <option value="live">Live only</option>
          <option value="both">Live + simulated</option>
          <option value="sim">Simulated only</option>
        </select>
        <a class="btn sm an-csv" href="#" download>Export CSV</a>
      </span>
    </div>

    <div class="wbody an-body" style="padding:8px;gap:8px">

      <div class="tiles an-tiles"></div>

      <div class="an-two">
        <div class="card">
          <h5>Standard-deviation touches <span class="note">what happened after each one</span></h5>
          <div class="tablewrap">
            <table class="grid an-touches">
              <thead><tr>
                <th>Level</th><th class="r">Touches</th><th style="width:84px"></th>
                <th class="r" title="Reached the mean, of those that resolved">Reverted</th>
                <th class="r" title="Median time from the touch to the mean">Median</th>
                <th class="r" title="Median further adverse move before it turned">Adverse</th>
                <th class="r" title="How many became an entry">Traded</th>
                <th class="r" title="Still running — counted, and left out of the percentage">Open</th>
              </tr></thead>
              <tbody></tbody>
            </table>
          </div>
          <div class="cb"><div class="finding an-touch-finding"></div></div>
        </div>

        <div class="an-stack">
          <div class="card">
            <h5>How they ended</h5>
            <div class="tablewrap">
              <table class="grid an-exits">
                <thead><tr><th>Reason</th><th class="r">Count</th><th class="r">Net</th></tr></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
          <div class="card">
            <h5>Costs <span class="note">budget against measurement</span></h5>
            <div class="tablewrap">
              <table class="grid an-costs">
                <thead><tr><th>Item</th><th class="r">Budgeted</th><th class="r">Actual</th><th class="r">Diff</th></tr></thead>
                <tbody></tbody>
              </table>
            </div>
            <div class="cb"><div class="finding warn an-cost-finding"></div></div>
          </div>
        </div>
      </div>

      <!-- What each fill cost against the price its decision was made at.
           Measured, never budgeted; unmeasured stands in its own column. -->
      <div class="card an-slip-card">
        <h5>Slippage <span class="note">each fill against the price its decision was made at &middot; positive a cost, negative an improvement</span>
          <a class="btn an-slip-csv" download title="One row per position, both ends; empty where nothing was measured">Export CSV</a></h5>
        <div class="tablewrap">
          <table class="grid an-slip">
            <thead><tr>
              <th></th><th class="r">Measured</th><th></th>
              <th class="r">Mean</th><th class="r">Median</th>
              <th class="r" title="The biggest cost">Worst</th>
              <th class="r" title="The biggest improvement">Best</th>
              <th class="r">Cost</th><th>Paid / earned</th>
            </tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="cb"><div class="hint an-slip-note"></div></div>
      </div>

      <div class="card an-replay-card">
        <h5>What a different threshold would have done
          <span class="note an-replay-note">a signal replay over recorded prices &mdash; not a fill simulator</span></h5>
        <div class="tablewrap">
          <table class="grid an-replay">
            <thead><tr>
              <th>Enter at |z|</th>
              <th class="r" title="Closed trades the replay would have taken">Trades</th>
              <th class="r">Win rate</th>
              <th class="r" title="After this contract's configured round trip">Net</th>
              <th class="r">Per trade</th>
              <th class="r" title="The worst single trade">Worst</th>
              <th class="r">Median hold</th>
              <th title="Below ten closed trades a figure is not a finding">Judged</th>
            </tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="cb">
          <div class="finding an-replay-finding"></div>
          <div class="hint an-replay-assumptions"></div>
        </div>
      </div>

      <div class="card">
        <h5>Trade journal <span class="note an-journal-note"></span></h5>
        <div class="tablewrap tall">
          <table class="grid an-journal">
            <thead><tr>
              <th>Entry</th><th>Exit</th><th>Side</th><th class="r">Qty</th>
              <th class="r" title="The z the entry actually fired at">Z in</th>
              <th class="r">Z out</th>
              <th class="r">Price in</th><th class="r">Price out</th>
              <th class="r">Gross</th><th class="r">Costs</th><th class="r">Net</th>
              <th class="r">On margin</th><th class="r">Held</th><th>Ended</th>
            </tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="cb"><div class="hint">Every column is what was recorded
          <b>at the time</b>, never recomputed now. Empty where nothing was
          measured, never zero.</div></div>
      </div>

      <!-- the All-contracts comparison -->
      <div class="card an-desk hidden">
        <h5>All contracts <span class="note">a comparison, not an average</span></h5>
        <div class="tablewrap">
          <table class="grid an-desk-table">
            <thead><tr>
              <th>Contract</th><th class="r">Trades</th><th class="r">Win</th>
              <th style="width:70px"></th>
              <th class="r">Net</th><th class="r">Avg</th><th class="r">On margin</th>
              <th class="r">Cost drag</th><th class="r">Avg hold</th>
              <th class="r">Best SD</th><th>Verdict</th>
            </tr></thead>
            <tbody></tbody>
            <tfoot><tr class="an-desk-total"></tr></tfoot>
          </table>
        </div>
        <div class="cb"><div class="hint an-desk-note"></div></div>
      </div>

    </div>
    <div class="wfoot">
      <span class="an-foot"></span>
      <span class="grow an-updated"></span>
    </div>
  </section>
</template>

<!-- One contract's Algo: SIGNAL & POSITION, STATISTICS, FILTERS, and a
     backtest of its settings over the recorded mids. The venue lists the
     spread itself, so there is one price — no legs. -->
<template id="contract-template">
  <section class="win contractwin algowin">
    <div class="titlebar">
      <span class="swatch"></span>
      <span class="title"></span>
      <span class="winbtns"><button class="winbtn min" title="Minimise — the taskbar button brings it back">&#8211;</button><button class="winbtn open-ladder" title="Open this contract's ladder — to trade by hand (MANUAL mode) or read the book"><svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><rect x="1.5" y="1" width="9" height="10" fill="none" stroke="currentColor" stroke-width="1.2"/><line x1="1.5" y1="4.3" x2="10.5" y2="4.3" stroke="currentColor"/><line x1="1.5" y1="7.6" x2="10.5" y2="7.6" stroke="currentColor"/><line x1="6" y1="1" x2="6" y2="11" stroke="currentColor"/></svg></button><button class="winbtn cog" title="This contract's Algo settings">&#9881;</button><button class="winbtn close" title="Close this window">&times;</button></span>
    </div>
    <div class="badgebar">
      <span class="state">&mdash;</span>
      <span class="dirbadge hidden" title="This contract enters in one direction only; exits are never restricted"></span>
      <span class="algo-switch" title="This contract's Algo — Off (you trade it by hand), Signals (the Algo signals and watches your position's TP/SL — you trade it on the ladder), Paper (the Algo trades it, filled here) or UAT / LIVE (the Algo trades it, orders sent to Stellar)"><button type="button" class="algo-btn off">ALGO OFF</button><span class="algo-menu" hidden><button type="button" data-algo="OFF">Off — trade by hand</button><button type="button" data-algo="DRY">Signals — the Algo signals, you trade</button><button type="button" data-algo="PAPER">Paper — the Algo trades it, filled here, nothing sent</button><button type="button" data-algo="SEND" class="live">UAT — the Algo trades it, orders sent to Stellar UAT</button></span></span>
    </div>
    <div class="wbody aw-body">
      <div class="aw-section aw-signal"></div>
      <div class="aw-closebar hidden"><button class="btn wide danger close-now" disabled>CLOSE NOW</button></div>
      <div class="aw-section aw-stats"></div>
      <div class="aw-section aw-filters"></div>
      <!-- What THESE settings would have done over the recorded mids — and
           without re-entry and the trend filter, beside it. Sends nothing. -->
      <div class="aw-section aw-backtest">
        <div class="aw-head">Backtest</div>
        <div class="aw-bt-controls">
          <select class="aw-bt-days" title="How much of the recording to replay">
            <option value="3">last 3 days</option>
            <option value="5" selected>last 5 days</option>
            <option value="10">last 10 days</option>
          </select>
          <button type="button" class="btn aw-bt-run" title="Replay the recorded mids through this contract's Algo, with its settings as they are now. Nothing is sent.">Run backtest</button>
        </div>
        <div class="aw-bt-out hint">What these settings would have done — nothing is sent.</div>
      </div>
    </div>
    <div class="wfoot">
      <span class="age">&mdash;</span>
      <span class="grow last-event"></span>
    </div>
  </section>
</template>

<!-- The contract's price ladder, beside its Algo — the MT5 desk's ladder,
     on ONE contract (the venue lists the spread itself: no legs). It shows
     the book, our working orders and the Algo's levels against it. In MANUAL
     mode it trades by hand through the manual ticket (reviewed, then sent as
     FTM-); in ALGO mode its order controls are off and it SAYS so. CLOSE ALL
     and Close @ LMT always close, by the position's own tickets. -->
<template id="ladder-template">
  <section class="win ladderwin">
    <div class="titlebar">
      <span class="swatch"></span>
      <span class="title"></span>
      <span class="ld-route" title="Stellar Security ID"></span>
      <span class="ld-ordtype" title="How the Algo sends its orders — set in this contract's settings"></span>
      <span class="algo-switch" title="This contract's Algo — Off (you trade it by hand), Signals (the Algo signals and watches your position's TP/SL — you trade it on the ladder), Paper (the Algo trades it, filled here) or UAT / LIVE (the Algo trades it, orders sent to Stellar)"><button type="button" class="algo-btn off">ALGO OFF</button><span class="algo-menu" hidden><button type="button" data-algo="OFF">Off — trade by hand</button><button type="button" data-algo="DRY">Signals — the Algo signals, you trade</button><button type="button" data-algo="PAPER">Paper — the Algo trades it, filled here, nothing sent</button><button type="button" data-algo="SEND" class="live">UAT — the Algo trades it, orders sent to Stellar UAT</button></span></span>
      <span class="winbtns"><button class="winbtn min" title="Minimise — the taskbar button brings it back">&#8211;</button><button class="winbtn close" title="Close this window">&times;</button></span>
    </div>
    <div class="ld-quotestrip">
      <span class="ld-netchg" title="The mid against today's open, in price">&mdash;</span>
      <div class="ld-stats">
        <span><label>H:</label><b class="ld-h">&mdash;</b></span>
        <span><label>L:</label><b class="ld-l">&mdash;</b></span>
      </div>
      <div class="ld-stats">
        <span><label>O:</label><b class="ld-o">&mdash;</b></span>
        <span><label>LT:</label><b class="ld-lt">&mdash;</b></span>
      </div>
      <span class="ld-ours" title="FIX market data carries no session high/low/open here: these are OUR own figures from the mids this system watched today (UTC). LT is Stellar's last trade — shown, never used as a price.">ours</span>
    </div>
    <div class="ld-lock"><span class="ld-lock-text"></span></div>
    <div class="ld-body">
      <div class="ld-rail">
        <div class="ld-routebox" title="The contract, its Stellar Security ID and the account its orders go to">
          <div class="ld-rb-sym">&mdash;</div>
          <div class="ld-rb-id">&mdash;</div>
          <div class="ld-rb-acct">&mdash;</div>
        </div>
        <div class="ld-moderow">
          <select class="ld-ot" disabled title="ALGO mode: the Algo's entry order type (set in the gear). MANUAL mode: how BUY / SELL go out">
            <option value="LIMIT">Lim</option><option value="MARKET">Mkt</option>
          </select>
          <select class="ld-tif" disabled title="Time in force of a manual order from this ladder">
            <option value="DAY">Day</option><option value="GTC">GTC</option>
          </select>
        </div>
        <div class="ld-quoting" title="How the Algo's orders are worked">&mdash;</div>
        <button class="ld-quick ld-buy" disabled title="MANUAL mode: BUY at the offer (or at market) — reviewed, then sent to Stellar as a manual ticket. Off in ALGO mode.">BUY 1</button>
        <button class="ld-quick ld-sell" disabled title="MANUAL mode: SELL at the bid (or at market) — reviewed, then sent to Stellar as a manual ticket. Off in ALGO mode.">SELL 1</button>
        <button class="ld-quick ld-flatten" disabled title="Close the open position at market, NOW, by its own tickets (77=C) — and stand this contract's Algo down. A close already working is escalated, never doubled.">CLOSE ALL</button>
        <div class="ld-closelmt">
          <input class="ld-close-px" type="number" step="any" placeholder="Close @ limit" title="The price to rest ONE closing limit at, for the whole open position, carrying its tickets. It waits there; CLOSE ALL crosses now.">
          <button class="ld-quick ld-close-go" disabled title="Rest a closing limit at the price in the box — a target, and no stop. The Algo is stood down with it.">@ LMT</button>
        </div>
        <label class="ld-inline ld-qtyrow"><span class="ld-qty-buy">Qty BUY</span><input class="ld-qtybox buy" type="number" disabled></label>
        <div class="ld-keypad">
          <button disabled>1</button><button disabled>5</button><button disabled>10</button>
          <button disabled>50</button><button disabled>100</button><button disabled>CLR</button>
        </div>
        <label class="ld-inline ld-qtyrow"><span class="ld-qty-sell">Qty SELL</span><input class="ld-qtybox sell" type="number" disabled></label>
        <div class="ld-raillabel">Working orders</div>
        <div class="ld-cxlrow">
          <button class="ld-cxl ld-cxl-s" title="Cancel this contract's working SELL orders">S<sup class="ld-n-s"></sup></button>
          <button class="ld-cxl ld-cxl-all" title="Cancel every working order of ours on this contract">CXL All<sup class="ld-n-all"></sup></button>
          <button class="ld-cxl ld-cxl-b" title="Cancel this contract's working BUY orders">B<sup class="ld-n-b"></sup></button>
        </div>
        <label class="ld-inline"><span>Increment</span><input class="ld-increment" type="number" min="0" step="any" title="One row of the ladder. Blank is the contract's tick."></label>
        <div class="ld-centrerow">
          <label class="ld-check" title="Hold the ladder exactly where it is — no automatic re-centring"><input type="checkbox" class="ld-lockscroll"> Lock</label>
          <label class="ld-check" title="Show only the rows that have something on them"><input type="checkbox" class="ld-filter"> Filter</label>
          <button class="btn ld-centre" title="Put the window back around the market now">Centre</button>
        </div>
      </div>
      <div class="ld-grid">
        <table>
          <thead><tr>
            <th class="c-work" title="Work — our working orders at this level (blue a buy, red a sell), and where the Algo's levels sit: TP, SL, BE, the band and the mean">Work</th>
            <th class="c-bid" title="Bids — the size Stellar shows bid at this price; with Depth: FULL, at every level of the book">Bids</th>
            <th class="c-price" title="The contract's price, one row per increment">Price</th>
            <th class="c-ask" title="Asks — the size Stellar shows offered at this price; with Depth: FULL, at every level of the book">Asks</th>
            <th class="c-ltq" title="LTQ — Stellar's last trade is marked here (a print, not an order); our own fills show their size">LTQ</th>
          </tr></thead>
          <tbody></tbody>
        </table>
        <div class="ld-counts"><span class="ld-cnt-b">B:0</span><span class="ld-cnt-s">S:0</span><span class="ld-cnt-w">W:0</span></div>
      </div>
    </div>
    <div class="ld-footer">
      <span class="ld-feed" title="The staleness and jump guards — a guard may withhold an order; it never prevents a close">&mdash;</span>
      <button class="btn ld-refresh" title="Ask Stellar for this contract's prices again (Market Data Request). Use it when the age here keeps climbing.">&#8635; Feed</button><button class="btn ld-depth" title="The order book: TOP shows the best bid and offer only; FULL asks Stellar for every level (MarketDepth 264=0) and shows each one's size at its price">Depth: TOP</button>
      <table class="ld-book"><thead><tr><th class="l">contract</th><th>Bid</th><th>Ask</th><th>Spread</th><th>Age</th></tr></thead><tbody><tr>
        <td class="l ld-bk-sym">&mdash;</td><td class="b ld-bk-bid">&mdash;</td><td class="a ld-bk-ask">&mdash;</td><td class="ld-bk-spr">&mdash;</td><td class="ld-bk-age">&mdash;</td>
      </tr></tbody></table>
      <div class="ld-dirs"><span class="ld-hl" title="H to L: sell the contract into its BID when the bid's z reaches the entry z">H &rarr; L <b class="ld-zb">&mdash;</b></span><span class="ld-lh" title="L to H: buy the contract's OFFER when the offer's z reaches −entry z">L &rarr; H <b class="ld-za">&mdash;</b></span></div>
      <span class="ld-pos">flat</span>
      <span class="ld-pnl">&mdash;</span>
    </div>
  </section>
</template>

<script src="{{ url_for('static', filename='monitor.js') }}?v={{ asset_version }}"></script>
<script src="{{ url_for('static', filename='app.js') }}?v={{ asset_version }}"></script>
</body>
</html>
